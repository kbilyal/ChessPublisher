name: Hub Site Beta Tests

on:
  push:
    branches:
      - beta/hub-site-v1.05.00
    paths:
      - 'hub/**'
      - '.github/workflows/hub-site-beta-tests.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'hub/**'

permissions:
  contents: read

jobs:
  responsive-browser-gate:
    name: Mobile and desktop browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static syntax and data-source checks
        run: |
          node --check hub/config.js
          node --check hub/data-source.js
          node --check hub/hub.js
          node --check hub/tests/data-source.test.cjs
          node hub/tests/data-source.test.cjs
          node -e "JSON.parse(require('node:fs').readFileSync('hub/sample-tournament.json','utf8')); console.log('PASS - fixture JSON')"

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chess-publisher-hub-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/hub/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chess-publisher-hub-server.log
          exit 1

      - name: Run responsive browser smoke tests
        run: node hub/tests/responsive-smoke.js

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-responsive-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
