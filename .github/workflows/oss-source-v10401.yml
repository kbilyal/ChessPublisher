name: Assemble v1.04.01 OSS source

on:
  push:
    branches:
      - 'fix/v1.04.01-oss-source'
    paths:
      - '.cp-oss-v10401-r2/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify sanitized stable source
        shell: bash
        run: |
          set -euo pipefail
          cat .cp-oss-v10401-r2/part-*.b64 > /tmp/oss-min-v10401.tar.xz.b64
          base64 -d /tmp/oss-min-v10401.tar.xz.b64 > /tmp/oss-min-v10401.tar.xz
          echo '761b36cc6d52cbfe71ffca7ad2e3ca7ad530d762ddc09c90155e7c7e72f85ad5  /tmp/oss-min-v10401.tar.xz' | sha256sum -c -

          rm -rf /tmp/oss-source-extract
          mkdir -p /tmp/oss-source-extract
          tar -xJf /tmp/oss-min-v10401.tar.xz -C /tmp/oss-source-extract
          cp -a /tmp/oss-source-extract/oss-min-v10401/. .

          echo '21ff798bd67a9f9dda83c29a2af861c2fcce3aa5bcc2a12c3465d361cd56fd36  ChessPublisher.html' | sha256sum -c -
          echo 'b0e941951102a36ad929064dd157af6bd942a4a598fe854919223f1e2bcef571  ChessPublisher-WebView.ps1' | sha256sum -c -
          echo '5ba79e21f19066f7bb9f55dd162eb433b0729fb4325198eb1748f7d439b10b9c  ChessPublisher-LocalEngine.ps1' | sha256sum -c -
          echo 'be0e3253ffd9f44d0027c13d126fb44b73919469ab0506ef7307c70b6244d7f7  FIDE-Update.ps1' | sha256sum -c -
          echo 'd23af37ce1624fac96b46f62c85d7801ed733a66f7e03bab40f453ce4db67861  webview/WebViewAdapter.js' | sha256sum -c -

          test "$(grep -F -c '__CP_CR_AES_IV_BYTES__' ChessPublisher-LocalEngine.ps1)" -eq 1
          test "$(grep -F -c '__CP_CR_AES_KEY_BYTES__' ChessPublisher-LocalEngine.ps1)" -eq 1
          grep -F 'data-chesspublisher-version="1.04.01"' ChessPublisher.html >/dev/null
          grep -F 'cpExportSwissManagerFullTournament' ChessPublisher.html >/dev/null
          grep -F '_TRF26_Starting_List.TXT' ChessPublisher.html >/dev/null
          grep -F 'cpCheckpointPersistenceForExport' ChessPublisher.html >/dev/null

      - name: Commit verified public source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cp-oss-v10401-r2 .cp-oss-v10401
          rm -f .github/workflows/oss-source-v10401.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore sanitized stable v1.04.01 public runtime source'
          git push origin HEAD:fix/v1.04.01-oss-source
