name: Maintain Pre-FIDE r12 Release

on:
  push:
    branches:
      - main
    paths:
      - 'pre-fide.json'
      - 'PRE-FIDE-v1.06.00-beta.98-r12.md'
      - '.github/workflows/publish-pre-fide-r12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-publisher-pre-fide-r12
  cancel-in-progress: false

jobs:
  maintain:
    name: Verify and maintain Pre-FIDE r12 installer release
    runs-on: ubuntu-latest
    env:
      TAG: v1.06.00-beta.98-r12-pre-fide
      SETUP_NAME: Chess-Publisher-v1.06.00-beta.98-r12-Setup.exe
      SETUP_SHA256: 37a8e5a88905849edb6ee9b83b1d7ca8d82c2ca170c9d8fc7617975aecf9e502
      SETUP_SIZE: '34183168'
      SETUP_URL: https://github.com/kbilyal/ChessPublisher/releases/download/v1.06.00-beta.98-r12-pre-fide/Chess-Publisher-v1.06.00-beta.98-r12-Setup.exe

    steps:
      - name: Checkout exact metadata commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify public self-contained installer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$SETUP_URL" -o "$SETUP_NAME"
          test "$(stat -c%s "$SETUP_NAME")" -eq "$SETUP_SIZE"
          printf '%s  %s\n' "$SETUP_SHA256" "$SETUP_NAME" | sha256sum -c -
          test "$(head -c 2 "$SETUP_NAME")" = 'MZ'
          echo 'PUBLIC SELF-CONTAINED INSTALLER INTEGRITY GATE: PASS'

      - name: Remove obsolete standalone-launcher assets and refresh release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG" 'ChessPublisher-v1.06.00-beta.98-r12.exe' --yes --repo "$GITHUB_REPOSITORY" || true
          gh release delete-asset "$TAG" 'SHA256SUMS.txt' --yes --repo "$GITHUB_REPOSITORY" || true
          gh release edit "$TAG" \
            --title 'Chess-Publisher v1.06.00-beta.98-r12 — Pre-FIDE / TEC Review Candidate' \
            --notes-file PRE-FIDE-v1.06.00-beta.98-r12.md \
            --prerelease \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify public prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets > release.json
          python - <<'PY'
          import json, os
          d=json.load(open('release.json',encoding='utf-8'))
          if not d.get('isPrerelease'):
              raise SystemExit('Release is not marked prerelease')
          assets={a['name']:a for a in d.get('assets',[])}
          setup=os.environ['SETUP_NAME']
          if setup not in assets:
              raise SystemExit('Self-contained Setup asset is missing')
          if int(assets[setup].get('size') or 0) != int(os.environ['SETUP_SIZE']):
              raise SystemExit('Setup asset size mismatch')
          obsolete={'ChessPublisher-v1.06.00-beta.98-r12.exe','SHA256SUMS.txt'} & set(assets)
          if obsolete:
              raise SystemExit('Obsolete release assets remain: '+', '.join(sorted(obsolete)))
          if 'SHA256SUMS-INSTALLER.txt' not in assets:
              raise SystemExit('Installer checksum asset is missing')
          print('PUBLIC PRE-FIDE INSTALLER RELEASE GATE: PASS')
          print(d['url'])
          PY
