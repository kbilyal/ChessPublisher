name: Linux Ubuntu Acceptance

on:
  push:
    branches:
      - linux-ubuntu-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pairing-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install protected runtime dependency
        run: python -m pip install --disable-pip-version-check 'networkx>=2.6'

      - name: Syntax check Linux runtime and acceptance harness
        run: |
          python -m py_compile \
            linux-port/ci/real_acceptance.py \
            linux-port/ci/trf_compat_acceptance.py \
            linux-port/ci/fide_contract_smoke.py \
            linux-port/ci/localengine_contract_smoke.py \
            linux-port/ci/chess_results_contract_smoke.py \
            linux-port/ci/bbp_adapter_contract.py \
            linux-port/ci/dgt_contract_smoke.py \
            linux-port/ci/source_guard_contract.py \
            linux-port/ci/self_test_contract.py \
            linux-port/ci/deb_install_smoke.py \
            linux-port/ci/chromium_runtime_smoke.py \
            linux-port/packaging/build_linux_bundle.py \
            linux-port/packaging/build_deb.py \
            linux-port/linux/build_info.py \
            linux-port/linux/build_identity_integration.py \
            linux-port/linux/source_guard.py \
            linux-port/linux/gacrux_runtime.py \
            linux-port/linux/bbp_runtime.py \
            linux-port/linux/fide_runtime.py \
            linux-port/linux/fide_integration.py \
            linux-port/linux/chess_results_runtime.py \
            linux-port/linux/chess_results_integration.py \
            linux-port/linux/dgt_runtime.py \
            linux-port/linux/dgt_integration.py \
            linux-port/linux/chess_publisher_linux.py \
            linux-port/linux/chess_publisher_linux_entry.py \
            linux-port/linux/self_test.py
          node --check linux-port/linux/LinuxWebViewShim.js
          node --check linux-port/ci/webview_shim_contract.mjs

      - name: Run protected source identity contract
        run: python linux-port/ci/source_guard_contract.py

      - name: Run BBP runtime adapter contract
        run: python linux-port/ci/bbp_adapter_contract.py

      - name: Run Linux DGT pseudo-hardware protocol contract
        run: python linux-port/ci/dgt_contract_smoke.py

      - name: Run Linux WebView safety and DGT PGN contract
        run: node linux-port/ci/webview_shim_contract.mjs

      - name: Run real Chromium Linux bridge smoke
        run: python linux-port/ci/chromium_runtime_smoke.py

      - name: Run exact pinned Chess-Publisher UI in Chromium
        run: python linux-port/ci/chromium_runtime_smoke.py --exact-drive-ui

      - name: Run offline FIDE runtime contract
        run: python linux-port/ci/fide_contract_smoke.py

      - name: Run Chess-Results secure Worker contract
        run: python linux-port/ci/chess_results_contract_smoke.py

      - name: Run integrated LocalEngine HTTP and served UI identity contract
        run: python linux-port/ci/localengine_contract_smoke.py

      - name: Run installed Linux self-test contract
        run: python linux-port/ci/self_test_contract.py

      - name: Run self-test pinned online engine install
        run: python linux-port/ci/self_test_contract.py --online-engines

      - name: Install, smoke-test and purge Linux deb
        run: python linux-port/ci/deb_install_smoke.py

      - name: Run real TRF16 and TRF26 compatibility
        run: python linux-port/ci/trf_compat_acceptance.py

      - name: Run real Gacrux BBP and Tie-Break acceptance
        run: python linux-port/ci/real_acceptance.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-real-acceptance-report
          path: linux-port/tests/logs/real-linux-acceptance.json
          if-no-files-found: warn

      - name: Upload verified Linux runtime kit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-publisher-linux-runtime-kit
          path: |
            linux-port/linux
            linux-port/packaging
            linux-port/source_manifest.json
          if-no-files-found: error
          retention-days: 14
