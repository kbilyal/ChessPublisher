name: Linux Ubuntu Acceptance

on:
  push:
    branches:
      - linux-ubuntu-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pairing-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install protected runtime dependency
        run: python -m pip install --disable-pip-version-check 'networkx>=2.6'

      - name: Syntax check Linux runtime and acceptance harness
        run: |
          python -m py_compile \
            linux-port/ci/real_acceptance.py \
            linux-port/ci/fide_contract_smoke.py \
            linux-port/ci/localengine_contract_smoke.py \
            linux-port/ci/chess_results_contract_smoke.py \
            linux-port/ci/bbp_adapter_contract.py \
            linux-port/linux/gacrux_runtime.py \
            linux-port/linux/bbp_runtime.py \
            linux-port/linux/fide_runtime.py \
            linux-port/linux/fide_integration.py \
            linux-port/linux/chess_results_runtime.py \
            linux-port/linux/chess_results_integration.py \
            linux-port/linux/chess_publisher_linux.py \
            linux-port/linux/chess_publisher_linux_entry.py
          node --check linux-port/linux/LinuxWebViewShim.js
          node --check linux-port/ci/webview_shim_contract.mjs

      - name: Run BBP runtime adapter contract
        run: python linux-port/ci/bbp_adapter_contract.py

      - name: Run Linux WebView Chess-Results safety contract
        run: node linux-port/ci/webview_shim_contract.mjs

      - name: Run offline FIDE runtime contract
        run: python linux-port/ci/fide_contract_smoke.py

      - name: Run Chess-Results secure Worker contract
        run: python linux-port/ci/chess_results_contract_smoke.py

      - name: Run integrated LocalEngine HTTP contract
        run: python linux-port/ci/localengine_contract_smoke.py

      - name: Run real Gacrux BBP and Tie-Break acceptance
        run: python linux-port/ci/real_acceptance.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-real-acceptance-report
          path: linux-port/tests/logs/real-linux-acceptance.json
          if-no-files-found: warn
