name: Linux Ubuntu Acceptance

on:
  push:
    branches:
      - linux-ubuntu-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pairing-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install protected runtime dependency
        run: python -m pip install --disable-pip-version-check 'networkx>=2.6'

      - name: Syntax check Linux runtime and acceptance harness
        run: |
          python -m py_compile \
            linux-port/ci/real_acceptance.py \
            linux-port/ci/trf_compat_acceptance.py \
            linux-port/ci/fide_contract_smoke.py \
            linux-port/ci/fide_endpoint_contract.py \
            linux-port/ci/fide_download_strategy_contract.py \
            linux-port/ci/fide_cache_contract.py \
            linux-port/ci/fide_live_download_contract.py \
            linux-port/ci/fide_legacy_limits_contract.py \
            linux-port/ci/fide_streaming_contract.py \
            linux-port/ci/localengine_contract_smoke.py \
            linux-port/ci/chess_results_contract_smoke.py \
            linux-port/ci/online_token_runtime_contract.py \
            linux-port/ci/linux_adapter_order_contract.py \
            linux-port/ci/live_acceptance_contract.py \
            linux-port/ci/bbp_adapter_contract.py \
            linux-port/ci/dgt_contract_smoke.py \
            linux-port/ci/telegram_contract_smoke.py \
            linux-port/ci/desktop_contract_smoke.py \
            linux-port/ci/browser_launcher_contract.py \
            linux-port/ci/window_mode_contract.py \
            linux-port/ci/source_guard_contract.py \
            linux-port/ci/source_bootstrap_contract.py \
            linux-port/ci/self_test_contract.py \
            linux-port/ci/deb_install_smoke.py \
            linux-port/ci/ubuntu_2604_container_smoke.py \
            linux-port/ci/chromium_runtime_smoke.py \
            linux-port/packaging/build_linux_bundle.py \
            linux-port/packaging/build_deb.py \
            linux-port/linux/build_info.py \
            linux-port/linux/build_identity_integration.py \
            linux-port/linux/hub_proxy_integration.py \
            linux-port/linux/source_guard.py \
            linux-port/linux/source_bootstrap.py \
            linux-port/linux/gacrux_runtime.py \
            linux-port/linux/bbp_runtime.py \
            linux-port/linux/fide_runtime.py \
            linux-port/linux/fide_payload_policy.py \
            linux-port/linux/fide_streaming_integration.py \
            linux-port/linux/fide_download_integration.py \
            linux-port/linux/fide_cache_integration.py \
            linux-port/linux/fide_integration.py \
            linux-port/linux/chess_results_runtime.py \
            linux-port/linux/chess_results_integration.py \
            linux-port/linux/dgt_runtime.py \
            linux-port/linux/dgt_integration.py \
            linux-port/linux/telegram_runtime.py \
            linux-port/linux/telegram_integration.py \
            linux-port/linux/desktop_integration.py \
            linux-port/linux/browser_integration.py \
            linux-port/linux/window_integration.py \
            linux-port/linux/chess_publisher_linux.py \
            linux-port/linux/chess_publisher_linux_entry.py \
            linux-port/linux/self_test.py \
            linux-port/linux/live_acceptance.py
          node --check linux-port/linux/LinuxWebViewShim.js
          node --check linux-port/ci/webview_shim_contract.mjs
          node --check linux-port/ci/telegram_webview_contract.mjs
          node --check linux-port/ci/online_token_webview_contract.mjs

      - name: Run protected source identity contract
        run: python linux-port/ci/source_guard_contract.py

      - name: Run fresh checkout source bootstrap contract
        run: python linux-port/ci/source_bootstrap_contract.py

      - name: Run BBP runtime adapter contract
        run: python linux-port/ci/bbp_adapter_contract.py

      - name: Run Linux adapter load-order contract
        run: python linux-port/ci/linux_adapter_order_contract.py

      - name: Run Linux DGT pseudo-hardware protocol contract
        run: python linux-port/ci/dgt_contract_smoke.py

      - name: Run Linux WebView safety and DGT PGN contract
        run: node linux-port/ci/webview_shim_contract.mjs

      - name: Run Organizer Token and Web sync WebView contract
        run: node linux-port/ci/online_token_webview_contract.mjs

      - name: Run Organizer Token scope and Hub Cloud proxy contract
        run: python linux-port/ci/online_token_runtime_contract.py

      - name: Run Telegram Linux transport contract
        run: python linux-port/ci/telegram_contract_smoke.py

      - name: Run Telegram WebView proxy contract
        run: node linux-port/ci/telegram_webview_contract.mjs

      - name: Run Linux desktop and report integration contract
        run: python linux-port/ci/desktop_contract_smoke.py

      - name: Run Linux fullscreen browser launcher contract
        run: python linux-port/ci/browser_launcher_contract.py

      - name: Run fullscreen version and Pairing popup contract
        run: python linux-port/ci/window_mode_contract.py

      - name: Run popup navigation and geometry in Chromium
        run: python linux-port/ci/window_browser_contract.py

      - name: Run real Chromium Linux bridge smoke
        run: python linux-port/ci/chromium_runtime_smoke.py

      - name: Run exact pinned Chess-Publisher UI in Chromium
        shell: bash
        run: |
          set +e
          python linux-port/ci/chromium_runtime_smoke.py --exact-drive-ui
          rc=$?
          set -e
          if [ "$rc" -eq 77 ]; then
            echo "::notice::Exact pinned UI Chromium gate is BLOCKED_BY_SOURCE_ACCESS; authenticated Drive source remains SHA256-pinned and local exact-UI HTTP smoke is required for package acceptance."
            exit 0
          fi
          exit "$rc"

      - name: Run offline FIDE runtime contract
        run: python linux-port/ci/fide_contract_smoke.py

      - name: Run resilient FIDE download strategy contract
        run: python linux-port/ci/fide_download_strategy_contract.py

      - name: Run offline FIDE cache contract
        run: python linux-port/ci/fide_cache_contract.py

      - name: Probe official FIDE Standard rating-list download
        shell: bash
        run: |
          set +e
          python linux-port/ci/fide_live_download_contract.py
          rc=$?
          set -e
          if [ "$rc" -eq 77 ]; then
            echo "::notice::Official ratings.fide.com is BLOCKED_BY_NETWORK from this hosted runner; offline seed/cache and deterministic downloader contracts remain mandatory and passed."
            exit 0
          fi
          exit "$rc"

      - name: Run FIDE LocalEngine update endpoint contract
        run: python linux-port/ci/fide_endpoint_contract.py

      - name: Run large FIDE legacy XML safety contract
        run: python linux-port/ci/fide_legacy_limits_contract.py

      - name: Run streamed FIDE legacy ZIP index contract
        run: python linux-port/ci/fide_streaming_contract.py

      - name: Run Chess-Results secure Worker contract
        run: python linux-port/ci/chess_results_contract_smoke.py

      - name: Run non-destructive live acceptance contract
        run: python linux-port/ci/live_acceptance_contract.py

      - name: Run integrated LocalEngine HTTP and served UI identity contract
        run: python linux-port/ci/localengine_contract_smoke.py

      - name: Run installed Linux self-test contract
        run: python linux-port/ci/self_test_contract.py

      - name: Run self-test pinned online engine install
        run: python linux-port/ci/self_test_contract.py --online-engines

      - name: Install, smoke-test and purge Linux deb on Ubuntu 24.04 runner
        run: python linux-port/ci/deb_install_smoke.py

      - name: Install and self-test Linux deb in clean Ubuntu 26.04 container
        run: python linux-port/ci/ubuntu_2604_container_smoke.py

      - name: Run real TRF16 and TRF26 compatibility
        run: python linux-port/ci/trf_compat_acceptance.py

      - name: Run real Gacrux BBP and Tie-Break acceptance
        run: python linux-port/ci/real_acceptance.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-real-acceptance-report
          path: linux-port/tests/logs/real-linux-acceptance.json
          if-no-files-found: warn

      - name: Stage FIDE offline seed archives for runtime kit
        if: success()
        run: |
          rm -rf linux-port/fide-cache
          mkdir -p linux-port/fide-cache
          cp fide/standard_rating_list.zip linux-port/fide-cache/
          cp fide/rapid_rating_list.zip linux-port/fide-cache/
          cp fide/blitz_rating_list.zip linux-port/fide-cache/
          test "$(find linux-port/fide-cache -maxdepth 1 -type f -name '*_rating_list.zip' | wc -l)" -eq 3

      - name: Upload verified Linux runtime kit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-publisher-linux-runtime-kit
          path: |
            linux-port/linux
            linux-port/packaging
            linux-port/source_manifest.json
            linux-port/fide-cache
          if-no-files-found: error
          retention-days: 14
