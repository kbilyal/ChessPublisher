name: Inspect R2 partial source archive

on:
  push:
    branches:
      - 'fix/v1.04.01-oss-source'
    paths:
      - '.cp-inspect-r2-ready'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover partial tar stream
        shell: bash
        run: |
          set -u
          cat .cp-oss-v10401-r2/part-*.b64 > /tmp/r2-partial.b64
          echo "b64=$(wc -c </tmp/r2-partial.b64)"
          base64 -d /tmp/r2-partial.b64 > /tmp/r2-partial.xz
          echo "xz=$(wc -c </tmp/r2-partial.xz)"
          set +e
          xz -dc /tmp/r2-partial.xz > /tmp/r2-partial.tar
          rc=$?
          set -e
          echo "xz_rc=$rc tar_bytes=$(wc -c </tmp/r2-partial.tar)"
          echo '--- TAR ENTRIES RECOVERABLE ---'
          tar -tvf /tmp/r2-partial.tar || true
          echo '--- FILE MARKERS ---'
          for f in ChessPublisher.html ChessPublisher-WebView.ps1 ChessPublisher-LocalEngine.ps1 FIDE-Update.ps1 webview/WebViewAdapter.js; do
            if tar -tf /tmp/r2-partial.tar "$f" >/dev/null 2>&1; then echo "FOUND $f"; else echo "MISSING $f"; fi
          done
