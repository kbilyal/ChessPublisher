name: Update FIDE rating lists

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fide.yml"

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update-fide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest official FIDE rating lists
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p fide

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            "https://ratings.fide.com/download/standard_rating_list.zip" \
            -o fide/standard_rating_list.zip

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            "https://ratings.fide.com/download/rapid_rating_list.zip" \
            -o fide/rapid_rating_list.zip

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            "https://ratings.fide.com/download/blitz_rating_list.zip" \
            -o fide/blitz_rating_list.zip

      - name: Commit updated FIDE files
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- fide)" ]; then
            echo "No FIDE list changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fide
          git commit -m "Update FIDE rating lists"
          git push
