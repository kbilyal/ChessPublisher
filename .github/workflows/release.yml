name: Build and publish release

# Stable desktop releases are promoted only from an explicitly validated candidate.
# Updating VERSION on main must never rebuild/clobber an already approved release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release (for example 1.05.01). Leave empty to use VERSION.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        shell: pwsh
        run: |
          $requested = '${{ inputs.version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($requested)) {
            $requested = (Get-Content -LiteralPath VERSION -Raw).Trim().TrimStart('v')
          }
          if ($requested -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version '$requested'. Expected a value such as 1.05.01."
          }
          $repoVersion = (Get-Content -LiteralPath VERSION -Raw).Trim().TrimStart('v')
          if ($repoVersion -ne $requested) {
            throw "VERSION is '$repoVersion' but the release request is '$requested'."
          }
          "RELEASE_VERSION=$requested" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$requested" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Refuse to overwrite an existing stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Stable assets are immutable; use a new version."
          }

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup 6 installation did not provide ISCC.exe.'
          }

      - name: Build installer, portable ZIP and checksums
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION -Date $env:RELEASE_DATE

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Publisher-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 3) {
            throw 'Expected installer, portable ZIP and checksum file in dist/.'
          }
          $args = @('release','create',$env:RELEASE_TAG) + $assets + @('--title',"Chess-Publisher $env:RELEASE_TAG",'--generate-notes','--latest','--target',$env:GITHUB_SHA,'--repo',$env:GITHUB_REPOSITORY)
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
