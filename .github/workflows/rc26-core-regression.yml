name: RC26 Core Regression Gate

on:
  push:
    branches:
      - test/rc26-core-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout core regression branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin upstream Gacrux 1.9.57 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/OttoMilvang/TieBreakServer.git "$RUNNER_TEMP/TieBreakServer"
          git -C "$RUNNER_TEMP/TieBreakServer" checkout 14a34a2c2f36509b110e4f25d6247f31fc4bf2f5
          test "$(git -C "$RUNNER_TEMP/TieBreakServer" rev-parse HEAD)" = "14a34a2c2f36509b110e4f25d6247f31fc4bf2f5"
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/TieBreakServer/requirements.txt"

      - name: Re-run RC26 pairing engine matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          python tests/linux-gacrux/rc26_compact_gate.py \
            --gacrux "$RUNNER_TEMP/TieBreakServer" \
            --report test-results/pairing-compact.json
          python tests/linux-gacrux/rc26_production_gate.py \
            --gacrux "$RUNNER_TEMP/TieBreakServer" \
            --report test-results/pairing-production.json

      - name: Run upstream Tie-Break Checker descriptor matrix
        shell: bash
        run: |
          set -euo pipefail
          python tests/core-regression/upstream_tiebreak_gate.py \
            --gacrux "$RUNNER_TEMP/TieBreakServer" \
            --report test-results/upstream-tiebreak.json

      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc26-core-regression-report
          path: test-results/
          if-no-files-found: warn
