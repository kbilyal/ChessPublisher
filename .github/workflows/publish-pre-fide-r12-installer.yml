name: Publish Pre-FIDE r12 Installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pre-fide-r12-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: kbilyal/ChessPublisher
      TAG: v1.06.00-beta.98-r12-pre-fide
      SETUP: Chess-Publisher-v1.06.00-beta.98-r12-Setup.exe
      SETUP_SHA256: 37a8e5a88905849edb6ee9b83b1d7ca8d82c2ca170c9d8fc7617975aecf9e502
      SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f6c8-8210-bdc5-d3cfb3d893da/raw?se=2026-09-17T07%3A24%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=e25fe7e7-867e-55bf-a1c1-82b98bc78886&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T06%3A46%3A27Z&ske=2026-09-18T06%3A46%3A27Z&sks=b&skv=2026-02-06&sig=dyNnIj1q0Zd3lYqa2ZfZ58I1TTr9rZ%2BjIHrKnzzLcFU%3D'

    steps:
      - name: Download exact self-contained installer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 "$SOURCE_URL" --output "$SETUP"
          test -s "$SETUP"

      - name: Verify installer SHA-256 and PE header
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$SETUP" | awk '{print $1}')"
          test "$actual" = "$SETUP_SHA256"
          test "$(head -c 2 "$SETUP")" = 'MZ'
          size="$(stat -c%s "$SETUP")"
          test "$size" -eq 34183168
          printf '%s  %s\n' "$SETUP_SHA256" "$SETUP" > SHA256SUMS-INSTALLER.txt

      - name: Replace broken standalone launcher with installer asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG" 'ChessPublisher-v1.06.00-beta.98-r12.exe' --repo "$REPO" --yes || true
          gh release delete-asset "$TAG" "$SETUP" --repo "$REPO" --yes || true
          gh release delete-asset "$TAG" 'SHA256SUMS-INSTALLER.txt' --repo "$REPO" --yes || true
          gh release upload "$TAG" "$SETUP" SHA256SUMS-INSTALLER.txt --repo "$REPO" --clobber

      - name: Verify public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json isPrerelease,assets --jq '.isPrerelease, (.assets[] | [.name,.size] | @tsv)'
          gh release view "$TAG" --repo "$REPO" --json assets --jq -e '.assets[] | select(.name == env.SETUP and .size == 34183168)' >/dev/null
